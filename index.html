<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="{{ink}}" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./brand/{{id}}/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./brand/{{id}}/icon-192.png" />
    <link rel="apple-touch-icon" href="./brand/{{id}}/icon-192.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="{{site}}brand/{{id}}/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; height: 100%; background: {{ink}}; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: {{ink}}; color: {{paper}}; font: 700 1.6rem system-ui, sans-serif; text-align: center; }
      #boot .dot { width: 54px; height: 54px; border-radius: 50%; background: {{primary}}; margin: 0 auto 16px; }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="{{title}}"></canvas>
    <div id="ui"></div>
    <div id="boot"><div><div class="dot"></div>{{brand}}</div></div>
    <noscript>{{title}} needs JavaScript.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
